<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Journal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: #e8e0d5;
    color: #332b25;
}


/* =========================
   PIN SCREEN
========================= */

#lockScreen {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px;
}

.lockBox {

    width: min(380px, 100%);

    background: #f8f3eb;

    padding: 45px 35px;

    border-radius: 8px;

    box-shadow: 0 15px 45px rgba(0,0,0,0.15);

    text-align: center;
}

.lockTitle {

    font-size: 32px;

    margin-bottom: 8px;
}

.lockSubtitle {

    font-size: 15px;

    color: #766b61;

    margin-bottom: 30px;
}

#pinInput {

    width: 100%;

    padding: 14px;

    font-size: 24px;

    text-align: center;

    letter-spacing: 8px;

    border: 1px solid #cfc3b6;

    border-radius: 6px;

    background: white;

    outline: none;
}

#pinInput:focus {

    border-color: #8f8174;
}

#unlockButton {

    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: none;

    border-radius: 6px;

    background: #332b25;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

#unlockButton:hover {

    opacity: 0.85;
}

#error {

    height: 20px;

    margin-top: 12px;

    color: #a24c4c;

    font-size: 14px;
}


/* =========================
   JOURNAL
========================= */

#journal {

    display: none;

    min-height: 100vh;

    padding: 30px;
}

.journalContainer {

    width: min(900px, 100%);

    margin: auto;
}

.topBar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.journalName {

    font-size: 25px;
}

#lockButton {

    border: 1px solid #b8aa9c;

    background: #f8f3eb;

    color: #4a4038;

    padding: 8px 14px;

    border-radius: 5px;

    cursor: pointer;

    font-family: inherit;
}


/* =========================
   PAPER
========================= */

.paper {

    background: #fffdf8;

    padding: 45px 65px 30px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.15);

    border-radius: 3px;

    min-height: 760px;
}

#date {

    font-size: 15px;

    color: #81766c;

    margin-bottom: 20px;
}


/* =========================
   WRITING AREA

   20 FIXED LINES
========================= */

#writingArea {

    display: block;

    width: 100%;

    height: 640px;

    border: none;

    outline: none;

    resize: none;

    overflow-y: hidden;

    background:

        repeating-linear-gradient(

            to bottom,

            transparent 0px,

            transparent 31px,

            #ded7cd 32px

        );

    font-family: Georgia, "Times New Roman", serif;

    font-size: 19px;

    line-height: 32px;

    color: #332b25;

    padding: 0;

}


/* =========================
   PAGE CONTROLS
========================= */

.pageControls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

    margin-top: 20px;
}

.pageButton {

    border: 1px solid #b8aa9c;

    background: #f8f3eb;

    color: #4a4038;

    padding: 8px 18px;

    border-radius: 5px;

    cursor: pointer;

    font-family: inherit;
}

.pageButton:hover {

    background: #eee6dc;
}

.pageButton:disabled {

    opacity: 0.4;

    cursor: default;
}

#pageNumber {

    min-width: 80px;

    text-align: center;

    color: #766b61;

    font-size: 15px;
}

#savedMessage {

    text-align: center;

    color: #81766c;

    font-size: 13px;

    margin-top: 10px;

    height: 18px;
}

#loading {

    position: fixed;

    inset: 0;

    background: #e8e0d5;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 18px;

    color: #766b61;

    z-index: 10;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #journal {

        padding: 12px;
    }

    .paper {

        padding: 35px 25px 25px;

        min-height: 700px;
    }

    #writingArea {

        height: 576px;

        font-size: 17px;

        line-height: 28.8px;

        background:

            repeating-linear-gradient(

                to bottom,

                transparent 0px,

                transparent 27.8px,

                #ded7cd 28.8px

            );
    }

}

</style>

</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    Loading journal...

</div>


<!-- =========================
     PIN SCREEN
========================= -->

<div id="lockScreen">

    <div class="lockBox">

        <div class="lockTitle">

            My Journal

        </div>

        <div class="lockSubtitle">

            Enter your PIN to open your journal

        </div>

        <input

            id="pinInput"

            type="password"

            inputmode="numeric"

            maxlength="4"

            placeholder="••••"

        >

        <button id="unlockButton">

            Unlock

        </button>

        <div id="error"></div>

    </div>

</div>


<!-- =========================
     JOURNAL
========================= -->

<div id="journal">

    <div class="journalContainer">


        <div class="topBar">

            <div class="journalName">

                My Journal

            </div>

            <button id="lockButton">

                Lock

            </button>

        </div>


        <div class="paper">

            <div id="date"></div>

            <textarea

                id="writingArea"

                placeholder="Start writing..."

                spellcheck="true"

            ></textarea>


            <div class="pageControls">

                <button

                    class="pageButton"

                    id="previousButton"

                >

                    ← Previous

                </button>


                <div id="pageNumber">

                    Page 1 / 10

                </div>


                <button

                    class="pageButton"

                    id="nextButton"

                >

                    Next →

                </button>

            </div>

        </div>


        <div id="savedMessage"></div>


    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE SETTINGS

   REPLACE THESE TWO VALUES
===================================================== */

const SUPABASE_URL = "https://jpwooypwkcaswevpksyc.supabase.co";

const SUPABASE_KEY = "sb_publishable_6d8AzQ0aI22cpl1HoAQqVQ_AlpjEy2p";


const { createClient } = window.supabase;

const db = createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);


/* =====================================================
   JOURNAL SETTINGS
===================================================== */

const CORRECT_PIN = "0707";

const TOTAL_PAGES = 10;


/* =====================================================
   ELEMENTS
===================================================== */

const loading = document.getElementById("loading");

const lockScreen = document.getElementById("lockScreen");

const journal = document.getElementById("journal");

const pinInput = document.getElementById("pinInput");

const unlockButton = document.getElementById("unlockButton");

const lockButton = document.getElementById("lockButton");

const error = document.getElementById("error");

const writingArea = document.getElementById("writingArea");

const savedMessage = document.getElementById("savedMessage");

const previousButton = document.getElementById("previousButton");

const nextButton = document.getElementById("nextButton");

const pageNumber = document.getElementById("pageNumber");

const date = document.getElementById("date");


/* =====================================================
   CURRENT PAGE
===================================================== */

let currentPage = 1;


/* =====================================================
   DATE
===================================================== */

const today = new Date();

date.textContent = today.toLocaleDateString(

    undefined,

    {

        weekday: "long",

        year: "numeric",

        month: "long",

        day: "numeric"

    }

);


/* =====================================================
   LOAD PAGE FROM SUPABASE
===================================================== */

async function loadPage(page) {

    savedMessage.textContent = "";

    writingArea.disabled = true;

    writingArea.value = "";


    const { data, error: dbError } = await db

        .from("journal_pages")

        .select("content")

        .eq("page_number", page)

        .single();


    if (dbError) {

        console.error(dbError);

        savedMessage.textContent = "Unable to load page.";

        writingArea.disabled = false;

        return;

    }


    writingArea.value = data ? data.content : "";

    writingArea.disabled = false;

    updatePageControls();

}


/* =====================================================
   SAVE PAGE TO SUPABASE
===================================================== */

let saveTimer = null;


function savePage() {

    clearTimeout(saveTimer);


    savedMessage.textContent = "Saving...";


    saveTimer = setTimeout(async function() {


        const { error: dbError } = await db

            .from("journal_pages")

            .upsert({

                page_number: currentPage,

                content: writingArea.value,

                updated_at: new Date().toISOString()

            });


        if (dbError) {

            console.error(dbError);

            savedMessage.textContent = "Couldn't save.";

        } else {

            savedMessage.textContent = "Saved";

        }


        setTimeout(function() {

            savedMessage.textContent = "";

        }, 1500);


    }, 500);

}


/* =====================================================
   PAGE CONTROLS
===================================================== */

function updatePageControls() {

    pageNumber.textContent =

        "Page " +

        currentPage +

        " / " +

        TOTAL_PAGES;


    previousButton.disabled =

        currentPage === 1;


    nextButton.disabled =

        currentPage === TOTAL_PAGES;

}


/* =====================================================
   NEXT PAGE
===================================================== */

async function nextPage() {

    if (currentPage >= TOTAL_PAGES) {

        return;

    }


    await savePage();


    currentPage++;

    await loadPage(currentPage);

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

async function previousPage() {

    if (currentPage <= 1) {

        return;

    }


    await savePage();


    currentPage--;

    await loadPage(currentPage);

}


/* =====================================================
   WRITING
===================================================== */

writingArea.addEventListener(

    "input",

    function() {

        savePage();

    }

);


/* =====================================================
   PAGE BUTTONS
===================================================== */

nextButton.addEventListener(

    "click",

    nextPage

);


previousButton.addEventListener(

    "click",

    previousPage

);


/* =====================================================
   PIN
===================================================== */

function unlockJournal() {


    if (pinInput.value === CORRECT_PIN) {


        lockScreen.style.display = "none";

        journal.style.display = "block";


        pinInput.value = "";

        error.textContent = "";


        loadPage(currentPage);


    } else {


        error.textContent = "Incorrect PIN.";

        pinInput.value = "";

        pinInput.focus();


    }

}


unlockButton.addEventListener(

    "click",

    unlockJournal

);


pinInput.addEventListener(

    "keydown",

    function(event) {


        if (event.key === "Enter") {

            unlockJournal();

        }


    }

);


/* =====================================================
   LOCK
===================================================== */

lockButton.addEventListener(

    "click",

    async function() {


        await savePage();


        journal.style.display = "none";

        lockScreen.style.display = "flex";


        writingArea.blur();


    }

);


/* =====================================================
   STARTUP
===================================================== */

async function startJournal() {


    loading.style.display = "none";

    lockScreen.style.display = "flex";

    journal.style.display = "none";


    updatePageControls();


    pinInput.focus();

}


startJournal();


</script>

</body>

</html>
